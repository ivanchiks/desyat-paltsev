<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Десять пальцев</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column (max 1040px). Header bar, then one screen swapped by JS. Practice screen stacks: stats → text → hint → keyboard → hands. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#DFE5EF; --ink:#151D2E; --muted:#5A6579; --line:#CBD3E0;
  --accent:#2747C9; --accent-ink:#FFFFFF; --mark:#FFD33D; --mark-ink:#1A1A1A; --key-shadow:#B9C2D3;
  --ok:#17804F; --err:#D3243A; --err-bg:#FCE1E5; --err-ink:#FFFFFF; --warn-bg:#FFF1C7; --warn-ink:#5C4300;
  --f0:#F5CFD7; --f1:#FADDBC; --f2:#FBEEA8; --f3:#CBEBC6; --f4:#C3E6F2; --f5:#D3D8FA; --f6:#E6D0F5; --f7:#F6CDE7; --f8:#DCE1EA;
  --k-accent:#E2552A; --k-bg:#E6F3FF; --cat:#F2A33C; --cat-in:#F7B6C2;
  --sky-top:#BFE3FF; --sky-bot:#EAF6FF; --balloon-ink:#1A1A1A;
  --b0:#FF8A80; --b1:#FFCC66; --b2:#8BD88B; --b3:#7CC4FF; --b4:#C9A0FF;
  --font-display:'Unbounded','Manrope',system-ui,sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-type:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --font-kids:'Nunito','Manrope',system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#171E2E; --surface-2:#222B3F; --ink:#E6EBF5; --muted:#9AA5BB; --line:#2E3852;
  --accent:#86A0FF; --accent-ink:#0E1320; --mark:#FFD33D; --mark-ink:#1A1A1A; --key-shadow:#0A0E18;
  --ok:#4CC38A; --err:#FF5F70; --err-bg:#43182255; --err-ink:#1A1A1A; --warn-bg:#3D3210; --warn-ink:#FFE08A;
  --f0:#4B2A33; --f1:#4B3722; --f2:#4A4420; --f3:#26412B; --f4:#1F3B48; --f5:#2C3263; --f6:#3D2B50; --f7:#4B2843; --f8:#2B3245;
  --k-accent:#FF8A5C; --k-bg:#0F1A2C; --cat:#E39A3A; --cat-in:#D88C9A;
  --sky-top:#1A2C4A; --sky-bot:#10192B; --balloon-ink:#1A1A1A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E2E; --surface-2:#222B3F; --ink:#E6EBF5; --muted:#9AA5BB; --line:#2E3852;
  --accent:#86A0FF; --accent-ink:#0E1320; --mark:#FFD33D; --mark-ink:#1A1A1A; --key-shadow:#0A0E18;
  --ok:#4CC38A; --err:#FF5F70; --err-bg:#43182255; --err-ink:#1A1A1A; --warn-bg:#3D3210; --warn-ink:#FFE08A;
  --f0:#4B2A33; --f1:#4B3722; --f2:#4A4420; --f3:#26412B; --f4:#1F3B48; --f5:#2C3263; --f6:#3D2B50; --f7:#4B2843; --f8:#2B3245;
  --k-accent:#FF8A5C; --k-bg:#0F1A2C; --cat:#E39A3A; --cat-in:#D88C9A;
  --sky-top:#1A2C4A; --sky-bot:#10192B; --balloon-ink:#1A1A1A;
  color-scheme:dark }
body[data-mode="kids"]{ --accent:var(--k-accent); --bg:var(--k-bg); --font-body:var(--font-kids); --r:22px }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:16px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0;font-family:var(--font-display);font-weight:700;font-size:19px}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--mark);color:var(--mark-ink);font-size:14px;box-shadow:0 3px 0 var(--key-shadow)}
.nav{display:flex;flex-wrap:wrap;gap:2px;margin-left:auto}
.nb{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer}
.nb:hover,.nb.on{background:var(--surface);color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--key-shadow)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:800;font-size:16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,var(--ink))}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--key-shadow);border:1px solid var(--line)}
.btn.big{padding:16px 26px;font-size:18px}
.btn.danger{background:var(--err);color:var(--err-ink);box-shadow:none}

/* welcome */
.welcome{display:grid;gap:28px;padding-block:24px}
.welcome h1{font-size:clamp(30px,6vw,56px)}
.welcome .lead{font-size:18px;color:var(--muted);max-width:60ch}
.choose{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.choice{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px;cursor:pointer;min-width:0}
.choice:hover{border-color:var(--accent)}
.choice h2{font-size:24px}
.choice .pic{height:120px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:14px;overflow:hidden}
.choice ul{margin:0;padding-left:18px;color:var(--muted)}
.choice .go{margin-top:auto;font-weight:800;color:var(--accent)}
.choice.kidsc{font-family:var(--font-kids)}
.choice.kidsc h2{font-family:var(--font-kids);font-weight:900;font-size:28px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:stretch;padding-block:12px 8px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-txt{display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero h1{font-size:clamp(26px,4.4vw,42px)}
body[data-mode="kids"] .hero h1,body[data-mode="kids"] .sec,body[data-mode="kids"] .result h1{font-family:var(--font-kids);font-weight:900}
.lead{font-size:17px;color:var(--muted);max-width:58ch}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.summary .cat{width:96px;align-self:center}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumrow b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.sumrow span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.sec{font-size:20px;margin-block:30px 12px}
.grp{display:grid;gap:8px;margin-bottom:18px}
.grp h3{font-family:var(--font-body);font-size:13px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lcard{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;min-width:0}
.lcard:hover{border-color:var(--accent)}
.lcard .num{font-size:12px;color:var(--muted);font-weight:700}
.lcard .ltr{font-family:var(--font-display);font-size:21px;letter-spacing:.04em}
.lcard .nm{font-size:14px;font-weight:700;line-height:1.25}
.lcard .st{font-size:13px;color:var(--muted);margin-top:4px}
.lcard.done .st{color:var(--ok);font-weight:700}
.lcard.locked{opacity:.5;cursor:not-allowed}
.lcard.locked:hover{border-color:var(--line)}
.lcard.next{border:2px solid var(--accent);padding:11px 13px}
.stars{color:var(--mark);text-shadow:0 1px 0 var(--key-shadow);letter-spacing:1px}
.stars .off{color:var(--surface-2);text-shadow:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;min-width:0}
.pcard:hover{border-color:var(--accent)}
.pcard h3{font-size:17px}
.pcard p{font-size:14px;color:var(--muted)}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 16px;font-weight:600;margin-top:16px}

/* keyboard */
.kbwrap{min-width:0}
@media (max-width:420px){.kbwrap{overflow-x:auto}.kbwrap .kb{min-width:340px}}
.kb{display:flex;flex-direction:column;gap:5px;background:var(--surface-2);padding:10px;border-radius:16px;user-select:none;--ks:clamp(26px,5.2vw,50px)}
.kr{display:flex;gap:5px}
.key{flex:1 1 0;min-width:0;height:var(--ks);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-weight:800;font-size:clamp(11px,1.9vw,18px);line-height:1;color:var(--ink);box-shadow:0 2px 0 var(--key-shadow);transition:transform .08s,background .12s}
.gap{flex:1 1 0}
.f0{background:var(--f0)}.f1{background:var(--f1)}.f2{background:var(--f2)}.f3{background:var(--f3)}.f4{background:var(--f4)}.f5{background:var(--f5)}.f6{background:var(--f6)}.f7{background:var(--f7)}.f8{background:var(--f8)}
.key .lab{font-size:.68em;font-weight:700;color:var(--muted)}
.key .up{font-size:.62em;color:var(--muted)} .key .lo{font-size:.9em}
.key.bump .big::after{content:'';position:absolute;bottom:18%;left:42%;width:16%;height:2px;background:currentColor;opacity:.55;border-radius:2px}
.key.next{background:var(--mark);color:var(--mark-ink);transform:translateY(-3px);box-shadow:0 0 0 3px var(--ink),0 5px 0 var(--key-shadow);z-index:1}
.key.next .lab,.key.next .up{color:var(--mark-ink)}
.key.miss{background:var(--err);color:var(--err-ink)}
.key.home{box-shadow:0 0 0 3px var(--accent)}
.key.hot{background:color-mix(in srgb,var(--err) var(--heat),var(--surface))}
.kb.dim .key:not(.next){opacity:.35}

/* hands */
.hands{display:block;width:100%;max-width:520px;margin:6px auto 0;height:auto}
.hands .palm{fill:var(--surface-2)}
.hands rect{stroke:var(--line);stroke-width:1.5}
.hands text{fill:var(--ink);font:800 15px var(--font-body);text-anchor:middle}
.fg{transition:transform .15s;transform-box:fill-box}
.fg.on{transform:translateY(-10px)}
.fg.on rect{stroke:var(--ink);stroke-width:3.5}

/* practice */
.practice{display:grid;gap:14px;padding-block:6px}
.ptop{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.ptitle{flex:1 1 200px;min-width:0}
.ptitle h2{font-size:clamp(18px,2.6vw,24px)}
.live{display:flex;gap:20px}
.live div{min-width:62px}
.live b{display:block;font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.live span{font-size:12px;color:var(--muted)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 16px;font-weight:700}
.textbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 22px;font-family:var(--font-type);font-size:clamp(20px,2.9vw,28px);line-height:1.8;height:calc(3 * 1.8em + 34px);overflow:hidden;scroll-behavior:smooth}
.textbox.big{font-size:clamp(24px,3.8vw,36px)}
body[data-mode="kids"] .textbox{font-family:var(--font-kids);font-weight:800;font-size:clamp(26px,4.4vw,40px);letter-spacing:.03em}
.text{position:relative}
.w{white-space:nowrap}
.c{border-radius:5px;padding:0 1px}
.c.sp{white-space:pre}
.c.ok{color:var(--muted);opacity:.55}
.c.fix{color:var(--err);opacity:.75}
.c.bad{color:var(--err);background:var(--err-bg);text-decoration:line-through}
.c.cur{background:var(--mark);color:var(--mark-ink);box-shadow:0 3px 0 var(--ink)}
.c.err{background:var(--err);color:var(--err-ink);animation:shake .25s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.c{display:inline-block}
.focusmask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:color-mix(in srgb,var(--surface) 88%,transparent);font:800 18px var(--font-body);cursor:pointer;border:0;width:100%;color:var(--ink)}
.hintrow{display:flex;align-items:center;justify-content:center;gap:14px;min-height:56px}
.hint{font-size:17px;font-weight:600;text-align:center}
.hint kbd{font-family:var(--font-display);background:var(--mark);color:var(--mark-ink);padding:3px 10px;border-radius:7px;font-size:1.05em;box-shadow:0 2px 0 var(--key-shadow)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;border:1px solid var(--line)}
.cat-s{width:64px;flex:none}
.bubble{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-weight:800;max-width:36ch}
.pfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}

/* result */
.result{display:grid;justify-items:center;text-align:center;gap:14px;padding-block:24px}
.result h1{font-size:clamp(28px,5vw,44px)}
.result .cat{width:120px}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:56px;height:56px}
.bigstars .on{fill:var(--mark);stroke:var(--mark-ink);stroke-width:1.5}
.bigstars .off{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(640px,100%)}
@media (max-width:520px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rgrid div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px}
.rgrid b{display:block;font-family:var(--font-display);font-size:28px;font-variant-numeric:tabular-nums}
.rgrid span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{background:var(--err-bg);color:var(--err);border-radius:8px;padding:4px 10px;font-weight:800}
.record{background:var(--mark);color:var(--mark-ink);border-radius:99px;padding:4px 14px;font-weight:800}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font-family:var(--font-display);font-size:26px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.chart{width:100%;height:auto;display:block}
.chart rect{fill:var(--accent);opacity:.5}
.chart rect.last{opacity:1}
.chart .grid{stroke:var(--line)}
.chart text{fill:var(--muted);font:600 11px var(--font-body)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td.n{font-variant-numeric:tabular-nums;text-align:right} th.n{text-align:right}
.empty{padding:24px;text-align:center;color:var(--muted)}

/* game */
.game{display:grid;gap:14px;padding-block:6px}
.ghud{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.ghud b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.garea{position:relative;height:min(52vh,420px);min-height:280px;background:linear-gradient(var(--sky-top),var(--sky-bot));border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.balloon{position:absolute;left:0;top:0;width:64px;height:80px;will-change:transform}
.bb{width:64px;height:76px;border-radius:50% 50% 46% 46%/55% 55% 45% 45%;display:flex;align-items:center;justify-content:center;font:900 32px var(--font-kids);color:var(--balloon-ink);box-shadow:inset -8px -8px 0 rgba(0,0,0,.08)}
.bb::after{content:'';position:absolute;top:76px;left:31px;width:2px;height:30px;background:var(--muted);opacity:.6}
.bb.c0{background:var(--b0)}.bb.c1{background:var(--b1)}.bb.c2{background:var(--b2)}.bb.c3{background:var(--b3)}.bb.c4{background:var(--b4)}
.bb.target{outline:4px solid var(--ink);outline-offset:2px}
.balloon.pop .bb{animation:pop .25s forwards}
@keyframes pop{to{transform:scale(1.7);opacity:0}}
.gover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:color-mix(in srgb,var(--surface) 82%,transparent);padding:16px}
.gover h2{font-family:var(--font-kids);font-weight:900;font-size:clamp(26px,5vw,40px)}
.setchips{display:flex;flex-wrap:wrap;gap:8px}
.setchips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:800;cursor:pointer}
.setchips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:50}
.sheet{background:var(--bg);color:var(--ink);border-radius:20px;max-width:760px;width:100%;padding:24px;display:grid;gap:16px;margin-block:auto;position:relative}
.sheet h2{font-size:24px;padding-right:40px}
.xbtn{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:20px;font-weight:800}
.schema{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.schema svg{display:block;width:100%;height:auto}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}
.steps li{padding-left:4px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.opt b{display:block}
.opt span{font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:160px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px;font:16px/1.5 var(--font-body);resize:vertical}
.errline{color:var(--err);font-weight:700}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app"></main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>

const NAMES = 'Анна Иван Мария Пётр Ольга Олег Елена Дмитрий Москва Волга Казань Самара Россия Урал Сибирь Нева Байкал'.split(' ');

(function merge(){ const D = fresh(); S = Object.assign(D, S); ['adult','kids'].forEach(m => { S[m] = Object.assign(prof(m==='kids'), S[m]||{}); S[m].settings = Object.assign(prof(m==='kids').settings, S[m].settings||{}); }); })();

const rnd = a => a[Math.floor(Math.random()*a.length)];

const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
const fmtTime = ms => { const s = Math.max(0, Math.round(ms/1000)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
function clean(t){
  return t.replace(/[«»“”„]/g,'"').replace(/[—–]/g,'-').replace(/…/g,'...').replace(/\s+/g,' ')
    .split('').filter(c => CHAR[c]).join('').replace(/ +/g,' ').trim();
}
const MAX_ERRORS = 3;
function starsFor(acc, miss){ return miss===0?3:miss<=2?2:miss<=MAX_ERRORS?1:0; }

function nextPart(i){ const n = partsOf(i).findIndex(x => x < 1); return n < 0 ? 0 : n; }
const nextLesson = () => { const i = LESSONS.findIndex((l,i) => !(P().lessons[i]||{}).done); return i<0 ? LESSONS.length-1 : i; };

/* ---------- генерация упражнений ---------- */
function pushUntil(parts, target, gen){
  let len = parts.join(' ').length, prev = '';
  let guard = 0;
  while (len < target && guard++ < 500){ let t = gen(); if (t===prev) continue; parts.push(t); prev = t; len += t.length+1; }
  return parts.join(' ');
}
function lessonText(i, part){
  const L = LESSONS[i], kids = isKids(), target = kids ? 70 : 170;
  if (L.sp === 'caps'){
    const w = DICT.filter(x=>x.length>2);
    return pushUntil([], target, () => Math.random()<0.35 ? rnd(NAMES) : (Math.random()<0.5 ? cap(rnd(w)) : rnd(w)));
  }
  if (L.sp === 'punct'){
    const w = DICT.filter(x=>x.length>1);
    return pushUntil([], target, () => {
      const n = 3 + Math.floor(Math.random()*3), a = [];
      for (let k=0;k<n;k++) a.push(rnd(w));
      if (n>3) a[1] += ',';
      return cap(a.join(' ')) + '.';
    });
  }
  if (L.sp === 'digits'){
    const w = DICT.filter(x=>x.length>2);
    return pushUntil([], target, () => {
      const r = Math.random();
      if (r<0.3) return String(Math.floor(Math.random()*90)+10);
      if (r<0.5) return String(1990 + Math.floor(Math.random()*40));
      if (r<0.75) return rnd('1234567890'.split('')) + rnd('1234567890'.split('')) + rnd('1234567890'.split(''));
      return rnd(w);
    });
  }
  const nw = [...L.n], al = [...lettersUpTo(i)];
  const words = DICT.filter(w => [...w].every(c => al.includes(c)));
  const freshW = words.filter(w => nw.some(c => w.includes(c)));
  const group = pNew => { const n = 2 + Math.floor(Math.random()*3); let t = ''; for (let k=0;k<n;k++) t += Math.random()<pNew ? rnd(nw) : rnd(al); return t; };
  const parts = [];
  if (part === 0){
    nw.forEach(c => parts.push(c.repeat(3)));
    if (nw.length > 1) parts.push(nw.join('')+nw.join(''), nw.slice().reverse().join('')+nw.join(''));
    return pushUntil(parts, target, () => group(0.75));
  }
  if (part === 1){
    const short = words.filter(w => w.length <= 4);
    return pushUntil(parts, target, () => short.length >= 5 && Math.random() < 0.35 ? rnd(short) : group(0.5));
  }
  return pushUntil(parts, target, () => {
    const r = Math.random();
    if (freshW.length >= 3 && r < 0.55) return rnd(freshW);
    if (words.length >= 6 && r < 0.85) return rnd(words);
    return group(0.5);
  });
}
function weakLetters(){
  return Object.entries(P().keys)
    .filter(([c,v]) => /[а-яё]/.test(c) && v.h+v.m >= 8)
    .map(([c,v]) => [c, v.m/(v.h+v.m)])
    .filter(x => x[1] > 0.04)
    .sort((a,b) => b[1]-a[1]).slice(0,5);
}

function makeCfg(kind, idx, part){
  const kids = isKids();
  if (kind === 'lesson'){
    const L = LESSONS[idx]; part = part || 0;
    return {kind, idx, part, eyebrow:'Урок '+(idx+1)+' из '+LESSONS.length+' · часть '+(part+1)+' из 3: '+(L.sp ? PART_NAMES_SP : PART_NAMES)[part], title: kids ? L.kid+': '+L.show : L.t, text: clean(lessonText(idx, part))};
  }
  if (kind === 'words'){
    const pool = kids ? KIDS_WORDS : DICT.filter(w=>w.length>2);
    return {kind, eyebrow:'Практика', title: kids ? 'Слова' : 'Случайные слова', text: clean(shuffle(pool).slice(0, kids?10:28).join(' '))};
  }
  if (kind === 'text'){
    if (kids) return {kind, eyebrow:'Практика', title:'Фразы', text: clean(shuffle(KIDS_PHRASES).slice(0,3).join(' '))};
    return {kind, eyebrow:'Практика', title:'Связный текст', text: clean(rnd(TEXTS))};
  }
  if (kind === 'review'){
    let last = -1; LESSONS.forEach((l,i) => { if ((P().lessons[i]||{}).done) last = i; });
    const al = [...lettersUpTo(last)];
    const pool = (kids ? KIDS_WORDS.concat(DICT) : DICT).filter(w => w.length > 1 && [...w].every(c => al.includes(c)));
    const text = pushUntil([], kids?90:220, () => pool.length >= 6 && Math.random() < 0.8 ? rnd(pool) : rnd(al)+rnd(al)+rnd(al));
    return {kind, eyebrow:'Практика', title:'Повторение пройденного', text: clean(text)};
  }
  if (kind === 'long')
    return {kind, eyebrow:'Практика', title:'Длинный текст', text: clean(shuffle(TEXTS).slice(0,3).join(' '))};
  if (kind === 'test')
    return {kind, eyebrow:'Проверка', title:'Тест на одну минуту', text: clean(shuffle(TEXTS).join(' ')), timeLimit:60000};
  if (kind === 'weak'){
    const ws = weakLetters().map(x=>x[0]);
    const pool = (kids ? KIDS_WORDS.concat(DICT) : DICT).filter(w => ws.some(c=>w.includes(c)));
    const text = pushUntil(ws.map(c=>c.repeat(3)), kids?70:170, () => pool.length>4 && Math.random()<0.75 ? rnd(pool) : rnd(ws)+rnd(ws)+rnd(ws));
    return {kind, eyebrow:'Работа над ошибками', title:'Трудные буквы: '+ws.map(c=>c.toUpperCase()).join(' '), text: clean(text)};
  }
  if (kind === 'custom')
    return {kind, eyebrow:'Свой текст', title:'Ваш текст', text: customText};
}

function beep(ok){
  if (!P().settings.sound) return;
  try {

}

function kbHTML(o){

  }).join('') + '</div>').join('') + '</div></div>';
}

    s += `<rect class="palm" x="${px}" y="${base-6}" width="176" height="76" rx="34"/>`;
    fs.forEach(d => {
      const f = side ? 7-d.f : d.f, x = side ? 600-d.x-W : d.x;
      s += `<g class="fg" data-f="${f}"><rect class="f${f}" x="${x}" y="${base-d.h}" width="${W}" height="${d.h+24}" rx="18"/><text x="${x+W/2}" y="${base-d.h+24}">${homes[f]}</text></g>`;

}

function stopPractice(){ clearInterval(timer); timer = 0; if (SES) SES.done = true; }
function dispChar(c){ return c===' ' ? 'Пробел' : esc(c); }
function updateCursor(){
  const s = SES, ch = s.text[s.pos], info = CHAR[ch], kids = isKids();
  app.querySelectorAll('.c.cur').forEach(e => e.classList.remove('cur'));
  const span = s.spans[s.pos];
  if (span){ span.classList.add('cur'); const lh = span.offsetHeight || 40; s.box.scrollTop = Math.max(0, span.offsetTop - lh*0.9); }
  app.querySelectorAll('.key.next').forEach(e => e.classList.remove('next'));
  app.querySelectorAll('.fg.on').forEach(e => e.classList.remove('on'));
  if (!info) return;
  const keyEl = k => app.querySelector(`.key[data-k="${k.id}"]`);
  const fingerEls = f => app.querySelectorAll(`.fg[data-f="${f}"]`);
  keyEl(info.k).classList.add('next');
  fingerEls(info.k.f).forEach(e => e.classList.add('on'));
  const F = kids ? FING_K : FING, verb = kids ? 'Нажми' : 'Нажмите';
  let h;
  if (info.shift){

function elapsed(){ return SES.t0 ? performance.now() - SES.t0 : 0; }

  if (/[a-z]/i.test(ch)){ showWarn('Включена английская раскладка. Переключите на русскую: Alt+Shift или Win+Пробел (на Mac — Ctrl+Пробел).'); return; }

function niceMax(v){ return [50,100,150,200,300,400,500,600,800,1000].find(s => s >= v) || Math.ceil(v/200)*200; }
function chartSVG(h){
  const n = h.length, W = 600, H = 200, pl = 40, pb = 14, pt = 10;

  h.forEach((x,i) => { const bh = Math.max(2,(H-pt-pb)*x.cpm/max); s += `<rect class="${i===n-1?'last':''}" x="${pl+i*bw+bw*.15}" y="${H-pb-bh}" width="${bw*.7}" height="${bh}" rx="3"><title>${esc(x.t)}: ${x.cpm} зн/мин, ${x.acc}%</title></rect>`; });

}

const GSETS = [
  {id:'home', t:'Средний ряд', l:'фывапролджэ'},

  {id:'bot', t:'Нижний ряд', l:'ячсмитьбю'},
  {id:'all', t:'Все буквы', l:ALL_LETTERS}

let G = null, gset = 'home';
function renderGame(){
  setView('game');
  const k = isKids();
  app.innerHTML = `<section class="game">
    <div class="ptop"><button class="btn ghost" data-act="home">← Назад</button>

    <div class="garea" id="garea"><div class="gover" id="gover">

    ${kbHTML()}

}
function startGame(){
  stopGame();
  const area = $('#garea'); area.querySelectorAll('.balloon').forEach(b => b.remove());
  $('#gover').hidden = true;
  G = {set:[...GSETS.find(s=>s.id===gset).l], b:[], score:0, missed:0, t0:performance.now(), last:0, prev:0, dur:60000, raf:0, over:false, area, n:0};
  G.raf = requestAnimationFrame(gLoop);
}
function stopGame(){ if (G){ cancelAnimationFrame(G.raf); G.over = true; } }
function gLoop(t){
  if (!G || G.over) return;
  const el = t - G.t0;
  if (el >= G.dur) return endGame();
  const dt = G.prev ? (t - G.prev)/1000 : 0; G.prev = t;
  const prog = el/G.dur, kids = isKids();
  const speed = (kids?32:50) + prog*(kids?38:70);
  const every = (kids?1800:1150) - prog*(kids?700:500);
  const H = G.area.clientHeight, W = G.area.clientWidth;
  if (t - G.last > every){
    G.last = t;
    const ch = rnd(G.set), d = document.createElement('div');
    d.className = 'balloon'; d.innerHTML = `<div class="bb c${G.n++%5}">${ch.toUpperCase()}</div>`;
    const b = {ch, el:d, x: 8 + Math.random()*Math.max(10, W-80), y: H};
    d.style.transform = `translate(${b.x}px,${b.y}px)`;
    G.area.appendChild(d); G.b.push(b);
  }
  G.b.forEach(b => { b.y -= speed*dt; b.el.style.transform = `translate(${b.x}px,${b.y}px)`; });
  G.b.filter(b => b.y < -110).forEach(b => { G.missed++; b.el.remove(); });
  G.b = G.b.filter(b => b.y >= -110);
  const target = G.b[0];
  app.querySelectorAll('.bb.target').forEach(e => e.classList.remove('target'));
  app.querySelectorAll('.key.next').forEach(e => e.classList.remove('next'));
  if (target){ target.el.firstChild.classList.add('target'); const info = CHAR[target.ch]; app.querySelector(`.key[data-k="${info.k.id}"]`).classList.add('next'); }
  $('#gScore').textContent = G.score; $('#gMiss').textContent = G.missed; $('#gTime').textContent = fmtTime(G.dur - el);
  G.raf = requestAnimationFrame(gLoop);
}
function gameKey(e){
  if (!G || G.over || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  e.preventDefault();
  const ch = e.key.toLowerCase();
  if (/[a-z]/.test(ch)){ $('#gover').hidden = false; $('#gover').innerHTML = '<h2>Включите русскую раскладку</h2><p class="lead">Alt+Shift или Win+Пробел (на Mac — Ctrl+Пробел), потом продолжайте.</p><button class="btn" data-act="gresume">Продолжить</button>'; G.over = true; G.paused = performance.now(); return; }
  const hit = G.b.filter(b => b.ch === ch).sort((a,b) => a.y - b.y)[0];
  if (hit){
    G.score++; beep(true); G.b = G.b.filter(b => b !== hit);
    hit.el.classList.add('pop'); setTimeout(() => hit.el.remove(), 260);
  } else { beep(false); flashKey(ch); }
}
function resumeGame(){
  if (!G) return; $('#gover').hidden = true;
  const pause = performance.now() - G.paused; G.t0 += pause; G.last += pause; G.prev = 0; G.over = false;
  G.raf = requestAnimationFrame(gLoop);
}
function endGame(){
  G.over = true;
  const p = P(), rec = G.score > (p.gameBest||0);
  if (rec) p.gameBest = G.score; save();
  G.b.forEach(b => b.el.remove()); G.b = [];
  app.querySelectorAll('.key.next').forEach(e => e.classList.remove('next'));
  const ov = $('#gover'); ov.hidden = false;
  ov.innerHTML = `<h2>${rec ? 'Новый рекорд!' : (G.score >= 20 ? 'Отлично!' : 'Хорошая игра!')}</h2>

    <div class="row" style="justify-content:center"><button class="btn big" data-act="gstart">Ещё раз</button><button class="btn ghost" data-act="home">На главную</button></div>`;
}

    ${opt('hands','Показывать руки','Схема рук под клавиатурой, нужный палец приподнят.')}
    ${opt('big','Крупный текст','Увеличенный шрифт в упражнениях.')}
    <div class="panel" id="resetBox"><b>Сбросить прогресс</b><p class="muted small">Удалит уроки, статистику и рекорды режима «${k?'Детский':'Взрослый'}» в этом браузере.</p><div class="row"><button class="btn ghost" data-act="reset">Сбросить…</button></div></div>`);
}
function openCustom(){
  openModal(`<h2>Свой текст</h2>
    <p class="muted">Вставьте или напечатайте любой текст на русском. Латинские буквы и редкие символы будут убраны, длинные тире заменены на дефис.</p>
    <textarea id="customIn" placeholder="Например, абзац из рабочего письма или любимой книги">${esc(customText)}</textarea>
    <p class="errline" id="customErr" hidden></p>
    <div class="row"><button class="btn" data-act="custom-go">Печатать этот текст</button></div>`);
  setTimeout(() => { const t = $('#customIn'); t && t.focus(); }, 30);
}

/* ---------- фокус ---------- */
function checkFocus(){ const m = $('#fmask'); if (m) m.hidden = document.hasFocus(); }
window.addEventListener('blur', checkFocus);
window.addEventListener('focus', checkFocus);

/* ---------- события ---------- */
function act(a, d){
  switch (a){
    case 'welcome': renderWelcome(); break;
    case 'mode': S.mode = d.m; save(); renderHome(); if (!S.seenGuide) openGuide(); break;
    case 'home': renderHome(); break;
    case 'stats': renderStats(); break;
    case 'guide': openGuide(); break;
    case 'settings': openSettings(); break;
    case 'close': closeModal(); break;
    case 'close-start': closeModal(); break;
    case 'lesson': { const i = +d.i; if (!unlocked(i)) return; closeModal(); startSession(makeCfg('lesson', i, d.p != null ? +d.p : nextPart(i))); break; }
    case 'words': case 'text': case 'test': case 'weak': case 'review': case 'long': startSession(makeCfg(a)); break;
    case 'custom': openCustom(); break;
    case 'custom-go': {
      const v = clean($('#customIn').value);
      if (v.length < 5){ const e = $('#customErr'); e.textContent = 'Добавьте хотя бы несколько слов на русском языке.'; e.hidden = false; return; }
      customText = v; closeModal(); startSession(makeCfg('custom')); break;
    }
    case 'restart': case 'again': {
      const c = a === 'again' ? lastResult.cfg : SES;
      startSession(c.kind === 'custom' ? makeCfg('custom') : makeCfg(c.kind, c.idx, c.part)); break;
    }
    case 'focus': window.focus(); checkFocus(); break;
    case 'game': renderGame(); break;
    case 'gset': gset = d.s; app.querySelectorAll('.setchips button').forEach(b => b.classList.toggle('on', b.dataset.s === gset)); if (G && !G.over) startGame(); break;
    case 'gstart': startGame(); break;
    case 'gresume': resumeGame(); break;
    case 'reset': $('#resetBox').innerHTML = `<b>Точно сбросить?</b><p class="muted small">Это нельзя отменить.</p><div class="row"><button class="btn danger" data-act="reset-yes">Да, сбросить</button><button class="btn ghost" data-act="reset-no">Отмена</button></div>`; break;
    case 'reset-no': openSettings(); break;
    case 'reset-yes': S[isKids()?'kids':'adult'] = prof(isKids()); save(); closeModal(); renderHome(); break;
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b){ act(b.dataset.act, b.dataset); return; }
  if (e.target === $('#modal')) closeModal();
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.set;
  if (k){ P().settings[k] = e.target.checked; save(); }
});
document.addEventListener('keydown', e => {
  if (modalOpen()){ if (e.key === 'Escape') closeModal(); return; }
  if (view === 'game') return gameKey(e);
  if (view === 'result' && e.key === 'Enter'){ e.preventDefault(); const b = app.querySelector('.btn.big'); b && b.click(); return; }
  if (view !== 'practice' || !SES || SES.done) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape'){ e.preventDefault(); act('restart', {}); return; }
  if (e.key === 'Backspace'){ e.preventDefault(); backspace(); return; }
  if (e.key === 'Tab' || e.key === 'Enter'){ e.preventDefault(); return; }
  if (e.key.length !== 1) return;
  e.preventDefault();
  typeChar(e.key, e);
});

/* ---------- старт ---------- */
if (S.mode) renderHome(); else renderWelcome();
})();
</script>
</body>
</html>
